<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080812"><meta name="robots" content="noindex,nofollow"><title>Owner Login — Sajan Jadon Studio</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page lamp-login">
<div class="login-stars" aria-hidden="true"></div><div class="lamp-scene" aria-hidden="true"><div class="lamp-glow"></div><div class="lamp-shade"></div><div class="lamp-neck"></div><div class="lamp-base"></div><div class="lamp-dust dust-a"></div><div class="lamp-dust dust-b"></div><div class="lamp-dust dust-c"></div></div>
<header class="login-top"><a class="brand" href="index.html"><span class="brand-mark">SJ</span><span>SAJAN <b>JADON</b><small>PRIVATE STUDIO</small></span></a><a class="login-back" href="index.html">← BACK TO SITE</a></header>
<main class="lamp-login-main"><section class="lamp-login-card"><div class="login-orbit-mark">SJ<span>®</span></div><div class="login-kicker"><i></i> OWNER ACCESS ONLY</div><h1>WELCOME<br><span>BACK.</span></h1><p class="login-copy">Private access to the Sajan Jadon studio.</p>
<form id="ownerLoginForm" autocomplete="on"><label for="ownerUsername">USERNAME</label><div class="login-input-wrap"><span>⌁</span><input id="ownerUsername" name="username" type="text" placeholder="Owner username" autocomplete="username" required minlength="3"></div><label for="ownerPassword">PASSWORD</label><div class="login-input-wrap"><span>⌑</span><input id="ownerPassword" name="password" type="password" placeholder="Enter owner password" autocomplete="current-password" required minlength="6"><button class="password-toggle" type="button" id="togglePassword" aria-label="Show password">◉</button></div><button class="lamp-submit" type="submit"><span>UNLOCK STUDIO</span><b>↗</b><i class="submit-light"></i></button><p id="loginMessage" class="login-message" role="status">Owner sign-in needs server-side authentication before this panel can be securely unlocked.</p></form>
<div class="login-footnote"><span>✦</span> OWNER ONLY <i></i> PRIVATE ACCESS</div></section></main>
<script>
const form=document.getElementById('ownerLoginForm');
const msg=document.getElementById('loginMessage');
const pass=document.getElementById('ownerPassword');
document.getElementById('togglePassword').addEventListener('click',e=>{const show=pass.type==='password';pass.type=show?'text':'password';e.currentTarget.textContent=show?'◎':'◉';e.currentTarget.setAttribute('aria-label',show?'Hide password':'Show password');});
form.addEventListener('submit',e=>{e.preventDefault();msg.textContent='Login UI is ready, but secure owner authentication is not connected. Do not enter a real password here until a server-side login endpoint is configured.';msg.classList.add('login-warning');});
</script></body></html>
